# Ready-to-run Promptfoo configuration for live provider endpoints (no local node_modules stored).
# Run `python run_eval.py` first to refresh results/promptfoo_tests.json, then:
# npx promptfoo@latest eval -c promptfooconfig.yaml
description: "ParcelDesk 20-case ungrounded mutating tool-argument evaluation"

prompts:
  - |
    {{ file://prompts/repaired_system.txt }}

    Session JSON:
    {{ session_json }}

    Customer message:
    {{ user_message }}

    Respond with a single JSON object {"tool": "...", "arguments": {...}}.

providers:
  - id: openai:gpt-4.1-mini
    config:
      temperature: 0
      response_format: { type: json_object }

defaultTest:
  assert:
    - type: python
      value: file://promptfoo_assert.py

tests: file://results/promptfoo_tests.json
